const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=d=>d?d.split('-').reverse().join('/'):'';
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const get=id=>E.find(e=>e.id==id);
let S={view:'activos',cat:null,sel:null,pre:null,edit:null,b:{r:'',tp:'',by:'',v:'',go:false},env:{r:'',id:null,q:''},q:{tp:'',by:'',v:''}};
function toast(t){const x=$('#toast');x.textContent=t;x.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>x.classList.remove('on'),2200)}
function go(k){if(k=='buscar'&&S.view!='buscar')S.b={r:'',tp:'',by:'',v:'',go:false};if(k=='prestamo'&&S.view!='prestamo')S.env={r:'',id:null,q:''};S.view=k;S.cat=null;S.sel=null;S.q={tp:'',by:'',v:''};S.qa=null;sd.classList.remove('open');render()}
function goBack(){sd.classList.remove('open');if(S.sel!=null)S.sel=null;else if(S.cat)S.cat=null;else return;render()}
function openF(el,k){el.classList.add('open');setTimeout(()=>{S.cat=k;S.q={tp:'',by:'',v:''};S.qa=null;render()},reduced?0:450)}
function setSt(id,st){const e=get(id);if(st=='papelera')e.prev=e.st;e.st=st;if(st=='archivado')e.tiene='Archivo';save();toast({archivado:'Expediente archivado',activo:'Expediente en trámite',papelera:'Enviado a la papelera'}[st]);S.sel=null;render()}
function ask(t,m,ok,fn,c){$('#cft').textContent=t;$('#cfm').textContent=m;const y=$('#cfy');y.className='btn '+(c||'r');y.textContent=ok;y.onclick=()=>{cf.close();fn()};cf.showModal()}
function del(id){E=E.filter(e=>e.id!=id);L=L.filter(l=>l.eid!=id);save();render();toast('Expediente eliminado')}
function delAsk(id){ask('¿Eliminar definitivamente?','Esta acción no se puede deshacer.','Eliminar',()=>del(id))}
function trashAsk(id){const e=get(id);ask('¿Enviar a la papelera?','Expediente '+e.num+'. Podrá restaurarlo después desde la papelera.','Enviar a papelera',()=>setSt(id,'papelera'))}
function saveEdit(id){const e=get(id),a=$('#ed-a').value.trim();if(!a){toast('El primer campo no puede quedar vacío');return}
 e.a=a;e.b=$('#ed-b').value.trim()||'—';e.enc=$('#ed-enc').value.trim()||'Secretaría';e.desc=$('#ed-desc').value.trim()||'—';e.nota=$('#ed-nota').value.trim();e.tiene=$('#ed-tiene').value;e.fo=+$('#ed-fo').value||0;S.edit=null;save();toast('Cambios guardados');render()}
function doSend(eid,q,fn,mot,f){const e=get(eid);L.push({id:Date.now(),eid,quien:q,motivo:mot,f:f||today(),fe:fn,dev:''});e.tiene=q;e.fo=fn;S.env={r:'',id:null,q:''};save();render();toast('Expediente enviado')}
function addLoan(){const eid=S.env.id,q=$('#pq').value.trim(),fn=$('#pn').value;
 if(!S.env.r||!eid){toast('Seleccione la rama y el expediente');return}
 if(!q){toast('Escriba a quién se envía');return}
 if(fn===''||+fn<0){toast('Indique el número de folios');return}
 const e=get(eid),mot=$('#pm').value.trim(),f=$('#pf').value;
 ask('¿Enviar este expediente?','Expediente '+e.num+' · se enviará a '+q+' con '+fn+' folios'+(mot?'. Motivo: '+mot:'')+'.','Enviar',()=>doSend(eid,q,+fn,mot,f),'g')}
function drawPick(){const v=S.env,box=$('#pick');$('#eq').disabled=!v.r;
 if(!v.r){box.innerHTML='<p class="hint">Seleccione primero la rama.</p>';return}
 const sent=new Set(L.filter(l=>!l.dev).map(l=>l.eid)),sl=v.id?get(v.id):null;
 const r=E.filter(e=>e.st!='papelera'&&e.t==v.r&&!sent.has(e.id)&&match(e,'',v.q)).sort((x,y)=>y.f.localeCompare(x.f));
 box.innerHTML=(sl?`<p class="hint"><b>Seleccionado:</b> ${esc(sl.num)}</p>`:'')+`<div class="pick">`+(r.map(e=>`<button type="button" class="pk ${v.id==e.id?'on':''}" onclick="pickE(${e.id})"><i class="dt ${e.t}"></i><span>${esc(e.num)}<small>${esc(e.a)} en contra de ${esc(e.b)} · ${ST[e.st]}</small></span></button>`).join('')||'<p class="hint">No hay expedientes disponibles para enviar.</p>')+`</div>`}
function pickE(id){S.env.id=id;fillFo();drawPick()}
function initE(){$('#er').value=S.env.r;$('#eq').value=S.env.q;drawPick();fillFo()}
function fillFo(){const e=S.env.id?get(S.env.id):null;$('#pn').value=e?(e.fo||0):''}
function devolver(id){const l=L.find(x=>x.id==id),e=get(l.eid),fe=l.fe??e.fo??0;$('#dvm').textContent='Expediente '+e.num+' · enviado a '+l.quien+' con '+fe+' folios.';$('#dvf').value=fe;
 $('#dvy').onclick=()=>{const v=$('#dvf').value;if(v===''){toast('Indique los folios recibidos');return}l.fr=+v;l.dev=today();e.fo=+v;e.tiene=e.st=='archivado'?'Archivo':'Secretaría';dv.close();save();render();toast('Devolución registrada')};dv.showModal()}
function fillAt(){$('#atp').innerHTML=TP[$('#at').value].map(t=>`<option>${t}</option>`).join('')}
function openAdd(){fillAt();sd.classList.remove('open');$('#af').value=today();dlg.showModal()}
function addExp(){const n=$('#an').value.trim(),a=$('#aa').value.trim();if(!n||!a){toast('Falta número o demandante');return}
 const t=$('#at').value;E.push({id:Date.now(),num:n,t,tp:$('#atp').value,fo:+$('#afo').value||0,f:$('#af').value||today(),a,b:$('#ab').value.trim()||'—',enc:$('#ae').value.trim()||'Secretaría',tiene:'Secretaría',nota:'',desc:$('#ad').value.trim()||'—',st:'activo'});
 save();dlg.close();$('#afo').value=0;['an','aa','ab','ae','ad'].forEach(i=>$('#'+i).value='');S={...S,view:'activos',cat:t,sel:null,edit:null,qa:null,q:{tp:'',by:'',v:''}};render();toast('Expediente añadido')}
function match(e,by,v){v=v.trim().toLowerCase();if(!v)return true;const nm=(e.a+' '+e.b).toLowerCase(),n=e.num.toLowerCase(),y=e.num.includes('-'+v+'-')||e.f.startsWith(v);return by=='n'?n.includes(v):by=='m'?nm.includes(v):by=='a'?y:(n.includes(v)||nm.includes(v)||y)}
const PH={'':'Número, nombre o año',n:'Ej. 01133-2026-199',m:'Ej. Juan Pérez',a:'Ej. 2026'};const setPh=(id,b)=>{$('#'+id).placeholder=PH[b||'']};
const SEL=(o,v)=>o.map(([k,t])=>`<option value="${k}" ${v==k?'selected':''}>${t}</option>`).join('');
function rowH(e,i,x){return `<button class="row ${e.t}" onclick="S.sel=${e.id};render()"><span class="k">${i+1})</span><span class="n"><span class="nh"><span class="nt">${esc(e.num)}</span>${x?`<span class="chip st-${e.st}">${ST[e.st]}</span>`:''}</span><small>${esc(e.a)} en contra de ${esc(e.b)}</small><small>${fmt(e.f)}</small><small>${esc(e.tp)}</small></span><span class="lt">Lo tiene:<b class="pill">${esc(e.tiene.toUpperCase())}</b></span></button>`}
function applyQ(){S.qa={...S.q};drawList()}
function drawList(){const st=S.view=='activos'?'activo':'archivado',q=S.qa||{tp:'',by:'',v:''};
 const r=E.filter(e=>e.st==st&&e.t==S.cat&&(!q.tp||e.tp==q.tp)&&match(e,q.by,q.v)).sort((x,y)=>y.f.localeCompare(x.f));
 $('#lst').innerHTML=r.length?r.map((e,i)=>rowH(e,i)).join(''):'<div class="empty">No hay expedientes que coincidan.</div>'}
function buscar(){return `<div class="card"><div class="fg"><div><label>Rama</label><select id="br" onchange="S.b.r=this.value;S.b.tp='';fillBt()"><option value="">Sin seleccionar</option>${SEL(Object.keys(TIPOS).map(k=>[k,TIPOS[k].n]),S.b.r)}</select></div><div><label>Tipo de expediente</label><select id="bt" onchange="S.b.tp=this.value"></select></div><div><label>Buscar por</label><select id="bb" onchange="S.b.by=this.value;setPh('bv',this.value)"><option value="">Sin seleccionar</option>${SEL([['n','Número'],['m','Nombre'],['a','Año']],S.b.by)}</select></div><div><label>Número, nombre o año</label><input id="bv" placeholder="${PH[S.b.by||'']}" value="${esc(S.b.v)}" oninput="S.b.v=this.value" onkeydown="if(event.key=='Enter')doBuscar()"></div><div class="bg"><button class="btn bl" onclick="doBuscar()">${ic('search')} BUSCAR</button></div></div></div><div id="lst"></div>`}
function fillBt(){const b=S.b,o=b.r?TP[b.r].map(t=>`<option>${t}</option>`).join(''):Object.keys(TP).map(k=>`<optgroup label="${TIPOS[k].n}">${TP[k].map(t=>`<option>${t}</option>`).join('')}</optgroup>`).join('');$('#bt').innerHTML='<option value="">Sin seleccionar</option>'+o;$('#bt').value=b.tp}
function initB(){const b=S.b;$('#br').value=b.r;fillBt();$('#bb').value=b.by;if(b.go)drawRes();else $('#lst').innerHTML='<div class="empty">Elija uno o más criterios (no es necesario llenarlos todos) y pulse BUSCAR.</div>'}
function doBuscar(){S.b.go=true;drawRes()}
function drawRes(){const b=S.b,r=E.filter(e=>e.st!='papelera'&&(!b.r||e.t==b.r)&&(!b.tp||e.tp==b.tp)&&match(e,b.by,b.v)).sort((x,y)=>y.f.localeCompare(x.f));
 $('#lst').innerHTML=r.length?`<p class="hint" style="grid-column:1/-1">${r.length} resultado${r.length==1?'':'s'}</p>`+r.map((e,i)=>rowH(e,i,1)).join(''):'<div class="empty">No se encontraron expedientes con esos criterios.</div>'}
function detail(e){const T=TIPOS[e.t],ed=S.edit==e.id&&e.st=='activo',hs=HOLD.includes(e.tiene)?HOLD:[e.tiene,...HOLD];
 const v=(k,l,val)=>`<div><h4>${l}:</h4>${ed?`<input id="ed-${k}" value="${esc(val)}">`:esc(val)}</div>`;
 let acts;
 if(ed)acts=`<button class="btn g" onclick="saveEdit(${e.id})">Guardar cambios</button><button class="btn r" onclick="S.edit=null;render();toast('Cambios cancelados')">Cancelar</button>`;
 else if(e.st=='activo')acts=`<button class="btn" onclick="setSt(${e.id},'archivado')">ARCHIVAR</button><button class="btn s" onclick="S.edit=${e.id};render()">Editar</button>`;
 else acts=`<button class="btn" onclick="setSt(${e.id},'activo')">DESARCHIVAR</button>`;
 return `<div class="meta"><span>Recepción: <b>${fmt(e.f)}</b></span><span>Estado: <span class="chip st-${e.st}">${ST[e.st]}</span></span><span>Rama: <span class="chip cr ${e.t}">${T.n}</span></span><span>Tipo: <span class="chip ct">${esc(e.tp)}</span></span></div>
<div class="det ${e.t}"><button class="tr" onclick="trashAsk(${e.id})" aria-label="Enviar a la papelera" title="Enviar a la papelera">${ic('trash')}</button>
${v('a',T.a[0],e.a)}${v('b',T.a[1],e.b)}${v('enc','Encargado',e.enc)}<div><h4>Folios:</h4>${ed?`<input id="ed-fo" type="number" min="0" value="${e.fo||0}">`:esc(e.fo||'—')}</div>
<div class="w"><h4>Descripción:</h4>${ed?`<textarea id="ed-desc" rows="4">${esc(e.desc)}</textarea>`:esc(e.desc)}</div>
<div class="w"><h4>Notas:</h4>${ed?`<textarea id="ed-nota" rows="2">${esc(e.nota)}</textarea>`:(esc(e.nota)||'—')}</div>
<div class="w"><h4>Quién lo tiene ahora:</h4>${ed?`<select id="ed-tiene">${hs.map(h=>`<option ${h==e.tiene?'selected':''}>${esc(h)}</option>`).join('')}</select>`:esc(e.tiene)}</div>
<div class="w acts">${acts}</div></div>`}
function folders(st){return `<p class="hint">Elija una categoría para ver sus expedientes.</p><div class="folders">`+Object.keys(TIPOS).map(k=>{const n=E.filter(e=>e.t==k&&e.st==st).length;
 return `<button class="fb ${k}" onclick="openF(this,'${k}')"><div class="fold"><i class="bk"></i><i class="pp"></i><i class="ft"><img src="icono-${k=='exhib'?'exhibiciones':k}.png" alt="" onload="this.nextElementSibling.style.display='none'" onerror="this.remove()">${ic(TIPOS[k].i,46)}</i></div><span>${TIPOS[k].n.toUpperCase()}</span><small>${n} expediente${n==1?'':'s'}</small></button>`}).join('')+'</div>'}
const ago=f=>{const d=Math.floor((Date.now()-new Date(f+'T00:00'))/864e5);return d<=0?'hoy':d==1?'hace 1 día':'hace '+d+' días'};
function loans(){
 const act=L.filter(l=>!l.dev).sort((x,y)=>y.f.localeCompare(x.f)),his=L.filter(l=>l.dev).sort((x,y)=>y.dev.localeCompare(x.dev)),nm=l=>esc(get(l.eid)?.num||'—');
 const df=l=>{if(l.fe==null||l.fr==null)return '';const d=l.fr-l.fe;return d==0?'<span class="chip st-activo">Folios completos</span>':`<span class="chip st-archivado">${d>0?'+':''}${d} folio${Math.abs(d)==1?'':'s'}</span>`};
 const frm=`<div class="card"><h3>Registrar envío</h3><p class="hint">Anote a quién se envía el expediente, por qué y con cuántos folios. Al devolverse se registran los folios recibidos.</p>
<div class="fg"><div><label>Rama</label><select id="er" onchange="S.env={r:this.value,id:null,q:''};$('#eq').value='';fillFo();drawPick()"><option value="">Sin seleccionar</option>${SEL(Object.keys(TIPOS).map(k=>[k,TIPOS[k].n]),S.env.r)}</select></div><div class="f2"><label>Expediente</label><input id="eq" placeholder="Buscar por número o nombre" oninput="S.env.q=this.value;drawPick()"><div id="pick"></div></div><div><label>Se envía a</label><input id="pq" list="dsts" placeholder="Ej. Notificador"></div><div><label>Motivo</label><input id="pm" list="mots" placeholder="Ej. Necesita notificar"></div><div><label>Folios enviados</label><input id="pn" type="number" min="0"></div><div><label>Fecha</label><input id="pf" type="date" value="${today()}"></div></div>
<datalist id="dsts"><option>Notificador</option><option>Comisario</option><option>Ministerio Público</option><option>Juzgado de Primera Instancia</option><option>Sala de Apelaciones</option><option>Archivo</option></datalist><datalist id="mots"><option>Necesita notificar</option><option>Traslado al Ministerio Público</option><option>Remitir a otro juzgado</option><option>Elevar en apelación</option><option>Archivo definitivo</option></datalist>
<div class="acts" style="margin-top:16px"><button class="btn g" onclick="addLoan()">Enviar</button></div></div>`;
 return `<div class="duo"><div class="bx"><i class="bd ${act.length?'':'z'}">${act.length}</i><div class="card"><h3>Enviados recientemente</h3>${act.map(l=>`<div class="ln"><div><b>${nm(l)}</b><br><small>Enviado a <b>${esc(l.quien)}</b> · ${ago(l.f)}<br>Motivo: ${esc(l.motivo||'—')}<br>${l.fe??'—'} folios enviados</small></div><button class="btn" onclick="devolver(${l.id})">Registrar devolución</button></div>`).join('')||'<p class="hint">No hay envíos pendientes de devolución.</p>'}</div></div>
<div class="bx"><i class="bd t">${his.length}</i><div class="card"><h3>Devueltos</h3>${his.map(l=>`<div class="ln"><div><b>${nm(l)}</b><br><small>De <b>${esc(l.quien)}</b> · devuelto ${fmt(l.dev)}<br>${l.fe??'—'} folios enviados → ${l.fr??'—'} recibidos</small></div>${df(l)}</div>`).join('')||'<p class="hint">Aún no hay devoluciones.</p>'}</div></div></div>`+frm}
function papelera(){const r=E.filter(e=>e.st=='papelera');return `<p class="hint">Los expedientes enviados aquí pueden restaurarse o eliminarse definitivamente.</p>`+(r.map(e=>`<div class="row ${e.t}"><span class="n">${esc(e.num)}<small>${esc(e.a)} vs. ${esc(e.b)} · ${TIPOS[e.t].n}</small></span><button class="btn s" onclick="setSt(${e.id},'${e.prev||'activo'}')">Restaurar</button><button class="btn r" onclick="delAsk(${e.id})">Eliminar</button></div>`).join('')||'<div class="empty">La papelera está vacía.</div>')}
function render(){
 $('#nav').innerHTML=NAV.map(([k,t,i])=>`<button class="nv ${S.view==k?'on':''}" onclick="go('${k}')" aria-label="${t}">${ic(i)}<span class="lb">${t}</span></button>`).join('');
 $('#bell').innerHTML=ic('bell')+(L.some(l=>!l.dev)?'<i class="dot"></i>':'');
 if(S.sel==null)S.edit=null;
 const v=S.view,sel=S.sel!=null?get(S.sel):null;
 $('#crumb').innerHTML=`<a onclick="S.cat=null;S.sel=null;render()">${BASE[v]}</a>`+(S.cat?` / <a onclick="S.sel=null;render()">${TIPOS[S.cat].n}</a>`:'')+(sel?` / ${esc(sel.num)}`:'');
 const m=$('#main');
 if(v=='prestamo'){m.innerHTML=loans();initE()}
 else if(v=='papelera')m.innerHTML=papelera();
 else if(sel)m.innerHTML=detail(sel);
 else if(v=='buscar'){m.innerHTML=buscar();initB()}
 else if(S.cat){const q=S.q;m.innerHTML=`<div class="srch"><label class="sl"><span>Tipo:</span><select onchange="S.q.tp=this.value"><option value="">Todos</option>${TP[S.cat].map(t=>`<option ${q.tp==t?'selected':''}>${t}</option>`).join('')}</select></label><label class="sl"><span>Buscar:</span><select onchange="S.q.by=this.value;setPh('qv',this.value)"><option value="">Todo</option>${SEL([['n','Número'],['m','Nombre'],['a','Año']],q.by)}</select></label><input id="qv" placeholder="${PH[q.by||'']}" value="${esc(q.v)}" oninput="S.q.v=this.value" onkeydown="if(event.key=='Enter')applyQ()"><button class="btn bl" onclick="applyQ()">${ic('search')} BUSCAR</button></div><div id="lst"></div>`;drawList()}
 else m.innerHTML=folders(v=='activos'?'activo':'archivado');
 window.scrollTo(0,0)}
document.querySelectorAll('[data-i]').forEach(e=>e.innerHTML=ic(e.dataset.i));
document.addEventListener('click',e=>{if(!sd.contains(e.target))sd.classList.remove('open')});
render();
</script></body></html>
